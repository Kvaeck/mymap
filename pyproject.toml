[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mymap"
version = "0.1.0"
description = "A mind mapping desktop app inspired by iMindMap 11, built with PySide6"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Meraclo Julius Rizky" }
]
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.2",
  "qt-material>=2.14",         # optional: for themes
  "requests",                  # optional: for online features
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mymap = ["ui/*.ui", "assets/**/*"]

[project.scripts]
mymap = "mymap.app:run"


